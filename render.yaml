# Render Blueprint for the backend. Secrets are marked sync: false and set in the Render dashboard.
services:
  - type: web
    name: gtm-strategy-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: MarketStrategy
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.7-flash,gemini-3.5-flash,gemini-3.5-flash-lite
      - key: JINA_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
